<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Spelling Quiz</title>
    <link rel="stylesheet" href="includes/style.css">
</head>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KWKY4PXV72"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-KWKY4PXV72');
</script>
<body>
    <div id="quiz-container">
        <h1>Spelling Quiz</h1>
        <div id="start-container">
            <button id="start-button">Start Quiz</button>
            <button id="decks-button">Decks</button>
        </div>
        <div id="decks-container" style="display: none;">
            <h2>Select Decks</h2>
            <input type="checkbox" id="shuffle" name="shuffle" value="Shuffle">
            <label for="shuffle"><b>Shuffle</b></label>
            <input type="checkbox" id="punct" name="Punctuation" value="Punctuation">
            <label for="punct"><b>Lax Punctuation</b></label>
            <input type="checkbox" id="caps" name="StrictCaps" value="Capitalization">
            <label for="caps"><b>Lax Caps</b></label>
            <hr/>
            <div id="checkbox-list"></div>
            <button id="confirm-decks-button">Confirm Decks</button>
        </div>
        <div id="question-container" style="display: none;">
            <div id="question"></div>
            <input type="text" id="answer" placeholder="Type your answer here">
            <button id="submit-answer">Submit</button>
            <button id="restart" onclick="restartQuiz()" style="display: none;">Try Again</button>
            <div id="feedback"></div>
            <div id="score"></div>
        </div>
    </div>

    <script src="includes/app.js"></script>
</body>
</html>
